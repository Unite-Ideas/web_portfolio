[project]
name = "portfolio"
version = "0.1.0"
description = "Find building photos and project details, then draft Unite Ideas portfolio posts in WordPress."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portfolio*"]

[tool.setuptools.package-data]
portfolio = ["templates/*.html", "*.php"]
